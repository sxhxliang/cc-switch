name: Release CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-cli:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact_name: cc-switch-cli.exe
            asset_name: cc-switch-cli-windows-x64.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: cc-switch-cli
            asset_name: cc-switch-cli-linux-x64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: cc-switch-cli
            asset_name: cc-switch-cli-macos-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            artifact_name: cc-switch-cli
            asset_name: cc-switch-cli-macos-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-target-

      - name: Build CLI (Release)
        working-directory: src-tauri
        run: cargo build --bin cc-switch-cli --release --target ${{ matrix.target }}

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME}"

          # Copy binary
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "src-tauri/target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "release-assets/${{ matrix.asset_name }}"
          else
            cp "src-tauri/target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "release-assets/${{ matrix.asset_name }}"
            chmod +x "release-assets/${{ matrix.asset_name }}"
          fi

          # Create compressed archive
          cd release-assets
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "cc-switch-cli-${VERSION}-${{ matrix.target }}.zip" "${{ matrix.asset_name }}"
          else
            tar -czf "cc-switch-cli-${VERSION}-${{ matrix.target }}.tar.gz" "${{ matrix.asset_name }}"
          fi

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CC-Switch CLI ${{ github.ref_name }}
          prerelease: false
          body: |
            ## CC-Switch CLI ${{ github.ref_name }}

            Terminal-based interface for managing Claude Code & Codex provider configurations.

            ### Download

            **Windows:**
            - `cc-switch-cli-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip`

            **Linux:**
            - `cc-switch-cli-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz`

            **macOS:**
            - `cc-switch-cli-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz` (Apple Silicon)
            - `cc-switch-cli-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz` (Intel)

            ### Features

            - ✅ Provider management (list, add, edit, delete, switch)
            - ✅ MCP server management (toggle, delete, import, sync)
            - ✅ Keyboard-driven TUI interface
            - ✅ Tab navigation between Claude and Codex
            - ✅ Built-in help screen (press `?`)

            ### Quick Start

            ```bash
            # Extract the archive
            tar -xzf cc-switch-cli-*.tar.gz  # Linux/macOS
            # or unzip on Windows

            # Run the CLI
            ./cc-switch-cli
            ```

            ### Keyboard Shortcuts

            - `↑/k`, `↓/j` - Navigate
            - `Enter` - Switch provider
            - `a` - Add provider
            - `e` - Edit provider
            - `d` - Delete provider
            - `m` - MCP management
            - `?` - Help
            - `q` - Quit
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-universal-macos:
    name: Create Universal macOS Binary
    runs-on: macos-14
    needs: build-cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build for both architectures
        working-directory: src-tauri
        run: |
          cargo build --bin cc-switch-cli --release --target aarch64-apple-darwin
          cargo build --bin cc-switch-cli --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          VERSION="${{ github.ref_name }}"
          mkdir -p release-assets

          # Create universal binary using lipo
          lipo -create \
            src-tauri/target/aarch64-apple-darwin/release/cc-switch-cli \
            src-tauri/target/x86_64-apple-darwin/release/cc-switch-cli \
            -output release-assets/cc-switch-cli

          chmod +x release-assets/cc-switch-cli

          # Verify
          echo "Universal binary architectures:"
          lipo -info release-assets/cc-switch-cli

          # Create archive
          cd release-assets
          tar -czf "cc-switch-cli-${VERSION}-universal-apple-darwin.tar.gz" cc-switch-cli

      - name: Upload Universal Binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/cc-switch-cli-${{ github.ref_name }}-universal-apple-darwin.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
